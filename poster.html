<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学员评价墙二维码</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:#0e0e12;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;margin:0;padding:20px;
  position:relative;overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:-50%;
  background:
    radial-gradient(circle at 20% 30%,rgba(157,75,94,.15),transparent 50%),
    radial-gradient(circle at 80% 70%,rgba(201,169,110,.08),transparent 50%);
  z-index:0;
}
.poster{
  background:linear-gradient(160deg,#1c1c22 0%,#141418 100%);
  border:1px solid rgba(255,255,255,.06);
  border-radius:28px;
  box-shadow:
    0 30px 80px rgba(0,0,0,.6),
    0 0 0 1px rgba(255,255,255,.03),
    inset 0 1px 0 rgba(255,255,255,.05);
  overflow:hidden;max-width:420px;width:100%;
  position:relative;z-index:1;
}
.header-zone{
  background:linear-gradient(135deg,#2a1520 0%,#1a1a22 60%,#141418 100%);
  padding:48px 32px 36px;text-align:center;position:relative;
  border-bottom:1px solid rgba(201,169,110,.12);
}
.header-zone::after{
  content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:60px;height:2px;
  background:linear-gradient(90deg,transparent,#c9a96e,transparent);
}
.brand-mark{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 14px;border:1px solid rgba(201,169,110,.3);
  border-radius:100px;margin-bottom:18px;
  font-size:11px;letter-spacing:.15em;color:#c9a96e;
}
.brand-mark .dot{width:5px;height:5px;border-radius:50%;background:#c9a96e}
.title-cn{
  font-family:'Noto Serif SC',serif;
  font-size:24px;font-weight:700;color:#f5f0e8;
  letter-spacing:.05em;line-height:1.3;
}
.title-sub{
  margin-top:10px;font-size:12px;color:#9a9590;
  letter-spacing:.08em;line-height:1.6;
}
.qr-zone{padding:36px 32px 32px;text-align:center}
.qr-frame{
  display:inline-block;padding:14px;
  background:#fff;border-radius:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.4);
  position:relative;
}
.qr-frame::before{
  content:'';position:absolute;inset:-1px;border-radius:19px;
  background:linear-gradient(135deg,rgba(201,169,110,.4),transparent 60%);
  z-index:-1;
}
.qr-frame img{width:220px;height:220px;display:block;border-radius:8px}
.qr-caption{margin-top:16px}
.qr-caption .line1{font-size:12px;color:#c9c5be;letter-spacing:.05em}
.qr-caption .line2{margin-top:4px;font-size:11px;color:#6b6864}
.info-block{
  margin:24px 32px 0;padding:16px 18px;
  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.05);
  border-radius:14px;text-align:left;
}
.info-block h3{
  font-size:11px;color:#c9a96e;font-weight:600;
  letter-spacing:.12em;margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.info-block ul{list-style:none}
.info-block li{
  font-size:12px;color:#9a9590;line-height:1.9;
  padding-left:14px;position:relative;
}
.info-block li::before{
  content:'';position:absolute;left:0;top:10px;
  width:5px;height:5px;border-radius:50%;
  background:#c9a96e;opacity:.6;
}
.url-block{
  margin:16px 32px 0;padding:12px 16px;
  background:rgba(201,169,110,.06);
  border:1px solid rgba(201,169,110,.15);
  border-radius:12px;
}
.url-block .label{font-size:10px;color:#6b6864;letter-spacing:.1em;margin-bottom:4px}
.url-block .url{font-size:11px;color:#d4c9b0;word-break:break-all;font-family:'SF Mono',monospace}
.actions{padding:20px 32px 28px;display:flex;flex-direction:column;gap:10px}
.btn-primary{
  padding:13px;border-radius:12px;
  background:linear-gradient(135deg,#c9a96e 0%,#b8955a 100%);
  color:#1a1410;font-size:13px;font-weight:600;
  letter-spacing:.05em;border:none;cursor:pointer;
  box-shadow:0 4px 16px rgba(201,169,110,.2);
}
.btn-secondary{
  padding:13px;border-radius:12px;
  background:rgba(255,255,255,.04);
  color:#c9c5be;font-size:13px;
  border:1px solid rgba(255,255,255,.08);cursor:pointer;
}
.footer-line{
  text-align:center;padding:0 32px 24px;
  font-size:10px;color:#4a4745;letter-spacing:.15em;
}
</style>
</head>
<body>
<div class="poster">
  <div class="header-zone">
    <div class="brand-mark"><span class="dot"></span>LEHAN · 择偶定位</div>
    <h1 class="title-cn">学员评价墙</h1>
    <p class="title-sub">真实学员反馈 · 见证每一次蜕变</p>
  </div>
  <div class="qr-zone">
    <div class="qr-frame">
      <img src="review-qrcode.png" alt="评价墙二维码" id="qr-img">
    </div>
    <div class="qr-caption">
      <p class="line1">微信 / 支付宝 / 相机 扫码均可</p>
      <p class="line2">游客可直接浏览 · 学员可登录提交评价</p>
    </div>
  </div>
  <div class="info-block">
    <h3>使 用 场 景</h3>
    <ul>
      <li>课程交付后发给学员扫码撰写评价</li>
      <li>朋友圈 / 社群分享，吸引潜在客户</li>
      <li>打印张贴于线下活动物料</li>
      <li>嵌入公众号文章引导扫码</li>
    </ul>
  </div>
  <div class="url-block">
    <div class="label">评价墙链接</div>
    <div class="url" id="url-text">https://mysyhxt666888.github.io/review-wall/</div>
  </div>
  <div class="actions">
    <button onclick="downloadQR()" class="btn-primary">保存二维码图片</button>
    <button onclick="downloadPoster()" class="btn-secondary">保存完整海报</button>
  </div>
  <div class="footer-line">LEHAN STUDIO · 择偶定位工作室</div>
</div>
<script>
function downloadQR(){
  const a=document.createElement('a');
  a.href='review-qrcode.png';
  a.download='择偶定位评价墙-二维码.png';
  a.click();
}
function downloadPoster(){ window.print(); }
</script>
</body>
</html>
