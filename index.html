let _tenantToken=null,_tokenExpireAt=0;
async function getTenantToken(){
  const now=Date.now();
  if(_tenantToken && now < _tokenExpireAt-60000) return _tenantToken;
  try{
    const res=await fetch('https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({app_id:FEISHU.APP_ID,app_secret:FEISHU.APP_SECRET})
    });
    const d=await res.json();
    if(d.code!==0){console.error('token err',d);throw new Error(d.msg)}
    _tenantToken=d.tenant_access_token;_tokenExpireAt=now+d.expire*1000;
    return _tenantToken;
  }catch(e){console.error(e);throw e}
}
async function feishuAPI(method,path,body){
  const token=await getTenantToken();
  const opts={method,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}};
  if(body!==undefined) opts.body=JSON.stringify(body);
  const res=await fetch('https://open.feishu.cn/open-apis'+path,opts);
  const d=await res.json();
  if(d.code!==0){console.error('feishu api err',path,d);throw new Error(d.msg||'API error')}
  return d;
}
// v3 wrapper: create returns record_id_list[0]; update uses batch_update
async function feishuCreate(tableId,fields){
  const d=await feishuAPI('POST',`/base/v3/bases/${FEISHU.BASE_TOKEN}/tables/${tableId}/records`,fields);
  return (d.data.record_id_list||[])[0];
}
async function feishuUpdate(tableId,recordId,fields){
  const d=await feishuAPI('POST',`/base/v3/bases/${FEISHU.BASE_TOKEN}/tables/${tableId}/records/batch_update`,{update_records:{[recordId]:fields}});
  return d;
}
async function feishuDelete(tableId,recordId){
  return feishuAPI('DELETE',`/base/v3/bases/${FEISHU.BASE_TOKEN}/tables/${tableId}/records/${recordId}`);
}
async function feishuList(tableId){
  const d=await feishuAPI('GET',`/base/v3/bases/${FEISHU.BASE_TOKEN}/tables/${tableId}/records?page_size=500`);
  return d.data.items||[];
}
async function feishuGet(tableId,recordId){
  const d=await feishuAPI('GET',`/base/v3/bases/${FEISHU.BASE_TOKEN}/tables/${tableId}/records/${recordId}`);
  return d.data.record;
}
async function feishuUploadImage(dataUrl){
  // dataUrl -> blob -> upload to feishu drive, return file_token
  const token=await getTenantToken();
  const arr=dataUrl.split(',');
  const mime=arr[0].match(/:(.*?);/)[1];
  const bstr=atob(arr[1]);let n=bstr.length;const u8=new Uint8Array(n);
  while(n--) u8[n]=bstr.charCodeAt(n);
  const blob=new Blob([u8],{type:mime});
  const fd=new FormData();
  fd.append('file_name','review_'+Date.now()+'.png');
  fd.append('parent_type','bitable_file');
  fd.append('parent_node',FEISHU.BASE_TOKEN);
  fd.append('size',blob.size);
  fd.append('file',blob);
  const res=await fetch('https://open.feishu.cn/open-apis/drive/v1/medias/upload_all',{
    method:'POST',headers:{'Authorization':'Bearer '+token},body:fd
  });
  const d=await res.json();
  if(d.code!==0) throw new Error('upload err: '+d.msg);
  return d.data.file_token;
}

function reviewToRecord(r){
  const rec={

    '学习后变化':r.afterChange,
    '专业评分':r.ratings.professional,
    '效果评分':r.ratings.effect,
    '服务评分':r.ratings.service,
    '性价比评分':r.ratings.value,
    '状态':[r.status==='approved'?'已通过':r.status==='rejected'?'已拒绝':'待审核']
  };
  // tags split into 3 fields
  const crowd=TAGS['人群'],problem=TAGS['问题'],effect=TAGS['效果'];
  rec['人群标签']=r.tags.filter(t=>crowd.includes(t));
  rec['问题标签']=r.tags.filter(t=>problem.includes(t));
  rec['效果标签']=r.tags.filter(t=>effect.includes(t));
  if(r.images&&r.images.length){
    rec['图片']=r.images.map(t=>({file_token:t}));
  }
  return rec;
}

function loadStore(){
  // local cache fallback
  try{const s=JSON.parse(localStorage.getItem(STORE_KEY));if(s)return s}catch(e){}
  return {users:[],reviews:DEFAULT_REVIEWS,currentUser:null,session:{}};
}
function saveStore(s){localStorage.setItem(STORE_KEY,JSON.stringify(s))}
let store=loadStore();
let dataReady=false;
async function loadFromFeishu(){
  // 数据来源：同目录 reviews.json（由 lark-cli 从飞书 Base 导出，规避浏览器跨域限制）
  // 写入链路：用户点击"写评价" → 跳转飞书表单 → 飞书 Base → 管理员审核后重新导出 reviews.json → H5 展示
  let reviews=[];
  try{
    const res=await fetch('./reviews.json?_='+Date.now(),{cache:'no-store'});
    if(res.ok){
      const d=await res.json();
      reviews=(d.reviews||d||[]).map(r=>Object.assign({},r));
      console.log('loaded reviews.json',reviews.length,'条');
    }
  }catch(e){console.error('fetch reviews.json failed',e)}
  if(!reviews.length){
    console.warn('reviews.json 不可用，使用内置默认评价');
    reviews=DEFAULT_REVIEWS.slice();
  }
  store.reviews=reviews;
  store.users=[];
  const local=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');
  if(local.currentUser) store.currentUser=local.currentUser;
  saveStore(store);
  dataReady=true;
}
async function initApp(){
  $('#app').innerHTML='<div class="flex items-center justify-center" style="height:100vh"><div class="text-gray-400 text-sm">加载中...</div></div>';
  await loadFromFeishu();
  $('#app').innerHTML=buildPages();
  window.addEventListener('hashchange',handleRoute);
  if(!location.hash)location.hash='#/home';
  else handleRoute();
}

function $(sel,parent){return (parent||document).querySelector(sel)}
function $$(sel,parent){return Array.from((parent||document).querySelectorAll(sel))}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}
function formatDate(d){const dt=new Date(d);const m=dt.getMonth()+1;const d2=dt.getDate();return`${dt.getFullYear()}年${m}月${d2}日`}
function avgRating(r){const s=r.ratings;return((s.professional+s.effect+s.service+s.value)/4).toFixed(1)}
function starsHtml(n){const full=Math.floor(n);const half=n-full>=.5;let html='';for(let i=0;i<5;i++){html+=`<span class="star-display">${i<full?'★':(i===full&&half?'☆':'☆')}</span>`}return html}
function getProduct(id){return PRODUCTS.find(p=>p.id===id)}
function escapeHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function isLogin(){return!!store.currentUser}

  const hash=location.hash.replace('#/','')||'home';

    <div class="mb-3"><input id="login-name" type="text" placeholder="昵称（选填）" class="w-full px-4 py-3 rounded-xl text-sm" style="border:1px solid var(--line);background:var(--cream)"></div>
    <button onclick="doLogin()" class="w-full py-3 rounded-xl text-white font-medium" style="background:linear-gradient(135deg,var(--rose),var(--rose-deep))">登录 / 注册</button>

  </div>`;

}
let codeTimer=null;
function sendCode(){
  const phone=$('#login-phone').value;
  if(!/^1\d{10}$/.test(phone)){toast('请输入正确的手机号');return}
  toast('验证码已发送：123456（演示用）');
  let sec=60;const btn=$('#send-code-btn');btn.disabled=true;
  codeTimer=setInterval(()=>{sec--;btn.textContent=`${sec}s后重发`;if(sec<=0){clearInterval(codeTimer);btn.disabled=false;btn.textContent='获取验证码'}},1000);
}
async function doLogin(){
  const phone=$('#login-phone').value;
  const code=$('#login-code').value;
  const name=$('#login-name').value||('用户'+phone.slice(-4));
  if(!/^1\d{10}$/.test(phone)){toast('请输入正确的手机号');return}
  if(code!=='123456'){toast('验证码错误，请输入123456');return}
  let user=store.users.find(u=>u.phone===phone);
  if(!user){
    user={id:'u_'+Date.now(),phone,name,userAvatar:'',isVerified:false,createdAt:new Date().toISOString()};
    store.users.push(user);
    // create in feishu
    try{
      const rid=await feishuCreate(FEISHU.TABLE_USERS,userToRecord(user));
      user.recordId=rid;
    }catch(e){console.error('create user failed',e)}
  }else{
    user.name=name;
    // update in feishu
    if(user.recordId){
      try{await feishuUpdate(FEISHU.TABLE_USERS,user.recordId,{'昵称':name})}catch(e){console.error('update user failed',e)}
    }
  }
  store.currentUser=user;
  saveStore(store);
  const m=document.getElementById('login-modal');if(m)m.remove();
  if(codeTimer)clearInterval(codeTimer);
  toast('登录成功');
  navigate('home');
}

        <textarea id="f-before" rows="4" placeholder="描述你学习之前遇到的具体问题..." class="w-full px-3 py-2.5 rounded-lg border border-gray-200 text-sm resize-none"></textarea>
      </div>
      <div class="bg-white rounded-xl p-4 shadow-sm mb-3">
        <label class="block text-sm font-bold mb-2 text-pink-600">学习后的变化 *</label>
        <textarea id="f-after" rows="4" placeholder="描述你学习之后取得了什么改变..." class="w-full px-3 py-2.5 rounded-lg border border-gray-200 text-sm resize-none"></textarea>
      </div>
      <div class="bg-white rounded-xl p-4 shadow-sm mb-3" id="comparison-block">
        <label class="block text-sm font-bold mb-2">前后对比（选填，建议填写）</label>
        <p class="text-xs text-gray-400 mb-2">添加2-3组对比，展示最显著的变化</p>
        <div id="comparison-list"></div>
        <button onclick="addComparison()" class="text-sm text-pink-500 mt-2">+ 添加对比</button>
      </div>
      <div class="bg-white rounded-xl p-4 shadow-sm mb-3">
        <label class="block text-sm font-bold mb-2">上传学习过程图片（选填）</label>
        <div id="image-preview" class="flex flex-wrap"></div>
        <input type="file" id="f-images" accept="image/*" multiple class="hidden" onchange="handleImages(this)">
        <button onclick="$('#f-images').click()" class="text-sm text-pink-500">+ 选择图片</button>
      </div>
      <div class="bg-white rounded-xl p-4 shadow-sm mb-3">
        <label class="block text-sm font-bold mb-2">多维度评分 *</label>
        ${['professional|专业能力','effect|实际效果','service|服务体验','value|性价比'].map(item=>{const[k,l]=item.split('|');return`<div class="flex items-center justify-between py-2"><span class="text-sm text-gray-600">${l}</span><div class="star-input-group" data-key="${k}">${[1,2,3,4,5].map(n=>`<span class="star-input" data-val="${n}" onclick="setRating('${k}',${n})">★</span>`).join('')}</div></div>`}).join('')}
      </div>
      <div class="bg-white rounded-xl p-4 shadow-sm mb-3">
        <label class="block text-sm font-bold mb-2">选择标签</label>
        ${tagHtml}
      </div>
      <button onclick="submitReview()" class="w-full py-3.5 rounded-xl bg-pink-500 text-white font-bold text-sm mb-3">提交评价</button>
      <p class="text-center text-xs text-gray-400">提交后需管理员审核通过后公开展示</p>
    </div>`;
  addComparison();addComparison();
}
let comparisonCount=0;
function addComparison(){
  comparisonCount++;
  const div=document.createElement('div');
  div.className='grid grid-cols-2 gap-2 mb-2';
  div.innerHTML=`<input type="text" placeholder="学习前..." class="px-3 py-2 rounded-lg border border-gray-200 text-xs c-before" oninput="this.value"><input type="text" placeholder="学习后..." class="px-3 py-2 rounded-lg border border-gray-200 text-xs c-after">`;
  $('#comparison-list').appendChild(div);
}
function setRating(key,val){
  submitState.ratings[key]=val;
  $$(`.star-input-group[data-key="${key}"] .star-input`).forEach(s=>{s.classList.toggle('active',+s.dataset.val<=val)});
}
function toggleTag(t){
  const idx=submitState.tags.indexOf(t);
  if(idx>=0)submitState.tags.splice(idx,1);else submitState.tags.push(t);
  event.target.classList.toggle('selected');
}
function handleImages(input){
  const files=Array.from(input.files);
  files.forEach(f=>{
    if(f.size>5*1024*1024){toast('图片不能超过5MB');return}
    const reader=new FileReader();
    reader.onload=e=>{
      submitState.images.push(e.target.result);
      renderImagePreview();
    };
    reader.readAsDataURL(f);
  });
  input.value='';
}
function renderImagePreview(){
  $('#image-preview').innerHTML=submitState.images.map((src,i)=>`<div class="upload-preview"><img src="${src}"><span class="remove" onclick="removeImage(${i})">×</span></div>`).join('');
}
function removeImage(i){submitState.images.splice(i,1);renderImagePreview()}
async function submitReview(){
  const user=store.currentUser;
  const product=$('#f-product').value;
  const studyTime=$('#f-time').value.trim();
  const teacher=$('#f-teacher').value;
  const before=$('#f-before').value.trim();
  const after=$('#f-after').value.trim();
  if(!studyTime){toast('请填写学习时间');return}
  if(!teacher){toast('请选择指导老师');return}
  if(before.length<10){toast('请详细描述学习前的问题（至少10字）');return}
  if(after.length<10){toast('请详细描述学习后的变化（至少10字）');return}
  for(const k of['professional','effect','service','value']){if(!submitState.ratings[k]){toast('请完成所有维度评分');return}}
  const comparisons=[];
  $$('#comparison-list > div').forEach(d=>{const b=d.querySelector('.c-before').value.trim();const a=d.querySelector('.c-after').value.trim();if(b&&a)comparisons.push({before:b,after:a})});
  const productObj=getProduct(product);
  // upload images to feishu, get file_tokens
  const imgTokens=[];
  for(const dataUrl of submitState.images){
    try{const t=await feishuUploadImage(dataUrl);imgTokens.push(t)}catch(e){console.error('img upload failed',e)}
  }
  const review={
    id:'r_'+Date.now(),userId:user.id,userName:user.name,userAvatar:user.userAvatar||'',phone:user.phone,isVerified:user.isVerified,
    product,productName:productObj.name,studyTime,teacher,beforeProblem:before,afterChange:after,comparison:comparisons,images:imgTokens,
    ratings:{...submitState.ratings},tags:submitState.tags.slice(),status:'pending',createdAt:new Date().toISOString()
  };
  store.reviews.push(review);
  saveStore(store);
  // create in feishu
  try{
    const rid=await feishuCreate(FEISHU.TABLE_REVIEWS,reviewToRecord(review));
    review.recordId=rid;
    saveStore(store);
  }catch(e){console.error('create review failed',e);toast('提交失败，请重试');return}
  toast('评价提交成功，等待审核');
  setTimeout(()=>navigate('home'),1500);
}

// --- PROFILE ---
function init_profile(){
  if(!isLogin()){$('#page-profile').innerHTML=`<div class="px-4 pt-20 text-center"><div class="text-5xl mb-4">👤</div><h2 class="text-lg font-bold mb-2 serif" style="color:var(--ink)">未登录</h2><p class="text-sm mb-6" style="color:var(--muted)">登录后可提交评价和管理个人信息</p><button onclick="showLogin()" class="px-8 py-3 rounded-xl text-white font-medium" style="background:linear-gradient(135deg,var(--rose),var(--rose-deep))">登录 / 注册</button><button onclick="navigate('home')" class="block w-full mt-3 text-sm" style="color:var(--muted)">游客浏览</button></div>`;return}
  const user=store.currentUser;
  const myReviews=store.reviews.filter(r=>r.userId===user.id);
  const avatar=user.userAvatar?`<img src="${user.userAvatar}" class="w-16 h-16 rounded-full object-cover">`:`<div class="w-16 h-16 rounded-full flex items-center justify-center font-bold text-2xl" style="background:var(--rose-light);color:var(--rose)">${user.name[0]}</div>`;
  const verifiedHtml=user.isVerified?'<span class="text-xs" style="color:var(--gold)">✦ 已认证学员</span>':'<span class="text-xs" style="color:#d97706">⚠️ 未认证</span>';
  const myReviewHtml=myReviews.length?myReviews.map(r=>{
    const statusMap={approved:'<span class="text-xs" style="color:#16a34a">已发布</span>',pending:'<span class="text-xs" style="color:#d97706">审核中</span>',rejected:'<span class="text-xs" style="color:#dc2626">未通过</span>'};
    return`<div class="rounded-xl p-3 mb-2" style="background:var(--cream);border:1px solid var(--line)" onclick="navigate('detail','${r.id}')"><div class="flex justify-between items-center mb-1"><span class="text-sm font-medium" style="color:var(--ink)">${r.productName}</span>${statusMap[r.status]||''}</div><div class="text-xs" style="color:var(--muted)">${formatDate(r.createdAt)}</div></div>`
  }).join(''):'<div class="text-center py-8 text-sm" style="color:var(--muted)">还没有评价，去分享你的经历吧</div>';
  $('#page-profile').innerHTML=`
    <div class="gradient-header text-white px-4 pt-12 pb-6" style="border-bottom-left-radius:28px;border-bottom-right-radius:28px">
      <div class="flex items-center mb-1">${avatar}<div class="ml-3"><div class="font-bold text-lg" style="color:#f5f0e8">${escapeHtml(user.name)}</div><div class="text-xs" style="color:rgba(245,240,232,.55)">${user.phone}</div><div class="mt-1">${verifiedHtml}</div></div></div>
    </div>
    <div class="px-4 pt-4">
      <div class="rounded-2xl p-4 mb-3" style="background:#fff;border:1px solid var(--line)"><h3 class="text-sm font-bold mb-3" style="color:var(--ink)">我的评价 (${myReviews.length})</h3>${myReviewHtml}</div>
      <button onclick="navigate('submit')" class="w-full py-3 rounded-xl font-medium text-sm mb-2" style="background:var(--rose-light);color:var(--rose)">+ 写新评价</button>
      <button onclick="navigate('qrcode')" class="w-full py-3 rounded-xl font-medium text-sm mb-2" style="background:#fff;color:var(--ink-soft);border:1px solid var(--line)">📱 生成评价墙二维码</button>
      <button onclick="navigate('admin')" class="w-full py-3 rounded-xl font-medium text-sm mb-2" style="background:#fff;color:var(--ink-soft);border:1px solid var(--line)">⚙️ 管理后台</button>
      <button onclick="logout()" class="w-full py-3 rounded-xl font-medium text-sm" style="background:#fff;color:#dc2626;border:1px solid var(--line)">退出登录</button>
    </div>`;
}
function logout(){store.currentUser=null;saveStore(store);toast('已退出');navigate('home')}

// --- ADMIN ---
function init_admin(){
  const pending=store.reviews.filter(r=>r.status==='pending');
  const approved=store.reviews.filter(r=>r.status==='approved');
  const rejected=store.reviews.filter(r=>r.status==='rejected');
  const allUsers=store.users;
  $('#page-admin').innerHTML=`
    <div class="gradient-header text-white px-4 pt-12 pb-4">
      <button onclick="navigate('home')" class="text-white/80 text-sm mb-2">← 返回</button>
      <h1 class="text-xl font-bold">管理后台</h1>
    </div>
    <div class="px-4 pt-4">
      <div class="grid grid-cols-3 gap-2 mb-4">
        <div class="bg-white rounded-xl p-3 text-center shadow-sm"><div class="text-xl font-bold text-orange-500">${pending.length}</div><div class="text-xs text-gray-400">待审核</div></div>
        <div class="bg-white rounded-xl p-3 text-center shadow-sm"><div class="text-xl font-bold text-green-500">${approved.length}</div><div class="text-xs text-gray-400">已通过</div></div>
        <div class="bg-white rounded-xl p-3 text-center shadow-sm"><div class="text-xl font-bold text-red-500">${rejected.length}</div><div class="text-xs text-gray-400">已拒绝</div></div>
      </div>
      <div class="bg-white rounded-xl p-4 shadow-sm mb-3"><h3 class="text-sm font-bold mb-3">注册用户 (${allUsers.length})</h3><div class="text-xs text-gray-500 space-y-1">${allUsers.map(u=>`<div class="flex justify-between"><span>${u.name} (${u.phone})</span>${u.isVerified?'<span class="text-blue-500">已认证</span>':'<span class="text-gray-400">未认证</span>'}</div>`).join('')||'<div class="text-gray-400">暂无注册用户</div>'}</div></div>
      <h3 class="text-sm font-bold mb-2">待审核评价</h3>
      <div id="pending-list">${pending.length?pending.map(r=>adminReviewCard(r)).join(''):'<div class="text-center py-8 text-gray-400 text-sm">暂无待审核评价</div>'}</div>
      <h3 class="text-sm font-bold mb-2 mt-4">已通过评价</h3>
      <div>${approved.map(r=>adminReviewCard(r)).join('')}</div>
    </div>`;
}
function adminReviewCard(r){
  const statusMap={approved:'<span class="text-green-500">已通过</span>',pending:'<span class="text-orange-500">审核中</span>',rejected:'<span class="text-red-500">已拒绝</span>'};
  let actions='';
  if(r.status==='pending')actions=`<button onclick="reviewAction('${r.id}','approved')" class="text-xs text-green-600 px-3 py-1 rounded bg-green-50">通过</button><button onclick="reviewAction('${r.id}','rejected')" class="text-xs text-red-600 px-3 py-1 rounded bg-red-50 ml-1">拒绝</button>`;
  if(r.status==='approved')actions=`<button onclick="reviewAction('${r.id}','rejected')" class="text-xs text-red-600 px-3 py-1 rounded bg-red-50">下架</button>`;
  if(r.status==='rejected')actions=`<button onclick="reviewAction('${r.id}','approved')" class="text-xs text-green-600 px-3 py-1 rounded bg-green-50">恢复</button>`;
  const toggleVerified=r.isVerified?'<span class="text-blue-500 text-xs">✅</span>':'<span class="text-gray-400 text-xs">未认证</span>';
  return`<div class="bg-white rounded-xl p-3 mb-2 shadow-sm"><div class="flex justify-between items-start mb-1"><div><span class="font-medium text-sm">${escapeHtml(r.userName)}</span> ${toggleVerified}</div>${statusMap[r.status]||''}</div><div class="text-xs text-gray-400 mb-1">${r.productName} · ${r.studyTime} · ${r.teacher}</div><div class="text-xs text-gray-500 text-truncate-2 mb-2">${escapeHtml(r.beforeProblem)}</div><div class="flex items-center justify-between"><span class="text-xs text-gray-400">${formatDate(r.createdAt)}</span><div>${actions}<button onclick="toggleUserVerified('${r.userId}')" class="text-xs text-blue-600 px-3 py-1 rounded bg-blue-50 ml-1">${r.isVerified?'取消认证':'认证学员'}</button></div></div></div>`
}
async function reviewAction(id,action){
  const r=store.reviews.find(x=>x.id===id);
  if(r){
    r.status=action;
    saveStore(store);
    toast('本地预览已更新。正式审核请在飞书 Base 中修改「状态」字段，再重新导出 reviews.json');
    init_admin();
  }
}
async function toggleUserVerified(userId){
  const u=store.users.find(x=>x.id===userId);
  if(u){
    u.isVerified=!u.isVerified;
    store.reviews.filter(r=>r.userId===userId).forEach(r=>{r.isVerified=u.isVerified});
    saveStore(store);
    toast('本地预览已更新。正式认证请在飞书 Base 中修改「是否认证学员」字段，再重新导出 reviews.json');
    init_admin();
  }else{
    const reviews=store.reviews.filter(r=>r.userId===userId);
    if(reviews.length){
      reviews.forEach(r=>r.isVerified=!r.isVerified);
      saveStore(store);
      toast('本地预览已更新。正式认证请在飞书 Base 中修改「是否认证学员」字段，再重新导出 reviews.json');
      init_admin();
    }
  }
}

// --- QRCODE ---
function init_qrcode(){
  const url=location.origin+location.pathname;
  $('#page-qrcode').innerHTML=`
    <div class="gradient-header text-white px-4 pt-12 pb-5" style="border-bottom-left-radius:28px;border-bottom-right-radius:28px">
      <button onclick="navigate('home')" class="text-sm mb-3" style="color:rgba(245,240,232,.7)">← 返回</button>
      <h1 class="serif text-xl font-bold" style="color:#f5f0e8">评价墙二维码</h1>
      <p class="text-xs mt-1" style="color:rgba(245,240,232,.55)">扫码即可进入学员评价墙</p>
    </div>
    <div class="px-4 py-6 text-center">
      <div class="rounded-2xl p-6 mx-auto inline-block" style="background:#fff;border:1px solid var(--line);box-shadow:0 8px 30px rgba(45,42,46,.06)">
        <div id="qrcode-container" class="inline-block"></div>
        <h2 class="serif text-lg font-bold mt-4" style="color:var(--ink)">择偶定位学员评价墙</h2>
        <p class="text-xs mt-1" style="color:var(--muted)">扫码查看真实学员反馈</p>
      </div>
      <div class="mt-6 rounded-xl p-4 text-left" style="background:#fff;border:1px solid var(--line)">
        <h3 class="text-sm font-bold mb-2" style="color:var(--ink)">📋 使用说明</h3>
        <ol class="text-xs space-y-1.5 list-decimal pl-4" style="color:var(--ink-soft)">
          <li>将二维码打印或发送给学员</li>
          <li>学员扫码后进入评价墙</li>
          <li>游客可直接浏览所有评价</li>
          <li>已认证学员可登录后提交评价</li>
          <li>管理员在「我的→管理后台」审核评价</li>
        </ol>
      </div>
      <div class="mt-4 rounded-xl p-3" style="background:var(--cream);border:1px solid var(--line)">
        <p class="text-xs mb-1" style="color:var(--muted)">评价墙链接：</p>
        <p class="text-xs break-all" style="color:var(--rose)">${url}</p>
      </div>
      <button onclick="downloadQR()" class="mt-4 px-8 py-2.5 rounded-xl text-white text-sm font-medium" style="background:linear-gradient(135deg,var(--rose),var(--rose-deep))">保存二维码图片</button>
    </div>`;
  // Generate QR code
  const container=$('#qrcode-container');
  container.innerHTML='';
  new QRCode(container,{text:url,width:200,height:200,colorDark:'#2d2a2e',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
}
function downloadQR(){
  const img=$('#qrcode-container img');
  if(!img){toast('二维码未生成');return}
  const a=document.createElement('a');
  a.href=img.src;
  a.download='review-wall-qrcode.png';
  a.click();
  toast('已保存');
}

// ======================== INIT ========================
initApp();
</script>
